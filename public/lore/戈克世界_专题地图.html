<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戈克世界 · 专题地图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#080b10;color:#e8e2d4;
    font-family:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
    min-height:100vh;padding:34px 20px 60px;overflow-x:auto;
  }
  .wrap{max-width:1400px;margin:0 auto}
  h1{font-size:26px;letter-spacing:6px;color:#f0d9a0;text-align:center}
  .sub{text-align:center;font-size:12px;letter-spacing:2px;color:#8b9aa6;margin-top:8px;margin-bottom:22px}
  .tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .tabs button{
    background:transparent;color:#9aa7b0;border:1px solid rgba(217,185,106,.25);
    padding:8px 18px;border-radius:3px;font-size:13px;letter-spacing:2px;cursor:pointer;
    font-family:inherit;transition:.25s;
  }
  .tabs button:hover{color:#f0d9a0;border-color:rgba(217,185,106,.6)}
  .tabs button.on{background:rgba(217,185,106,.14);color:#f0d9a0;border-color:#d9b96a}
  .stage{
    position:relative;border:1px solid rgba(217,185,106,.25);
    box-shadow:0 24px 60px rgba(0,0,0,.65);overflow:hidden;background:#0b1016;
  }
  .stage > img{display:block;width:100%}
  .stage > svg{position:absolute;inset:0;width:100%;height:100%}
  .layer{opacity:0;pointer-events:none;transition:opacity .45s ease}
  .layer.on{opacity:1}
  .desc{
    margin-top:16px;font-size:13px;line-height:2;color:#9aa7b0;
    border-left:2px solid rgba(217,185,106,.45);padding-left:16px;min-height:56px;
  }
  .desc b{color:#e8e2d4}
  .legend{
    margin-top:12px;display:flex;flex-wrap:wrap;gap:10px 22px;
    font-size:11px;color:#8b9aa6;
  }
  .legend span{display:flex;align-items:center;gap:6px}
  .sw{width:11px;height:11px;border-radius:2px;display:inline-block}
  @media(max-width:700px){ .tabs button{padding:6px 12px;font-size:12px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>世 界 地 图 · 专 题 图</h1>
  <div class="sub">同一片世界，六种读法</div>

  <div class="tabs">
    <button class="on" data-i="0">地形</button>
    <button data-i="1">势力</button>
    <button data-i="2">航路</button>
    <button data-i="3">城市</button>
    <button data-i="4">历史</button>
    <button data-i="5">生物群系</button>
  </div>

  <div class="stage">
    <img src="assets/worldmap_ai.webp" alt="戈克世界">
    <svg viewBox="0 0 2000 1125" preserveAspectRatio="none">

      <!-- ============ 1. 地形 ============ -->
      <g class="layer on" data-layer="0">
        <!-- 西大陆雪山带 -->
        <g fill="#2a2115" opacity=".55">
          <path d="M 250,300 l 26,-40 l 26,40 Z"/><path d="M 292,310 l 30,-46 l 30,46 Z"/>
          <path d="M 340,300 l 24,-36 l 24,36 Z"/><path d="M 210,320 l 22,-34 l 22,34 Z"/>
          <path d="M 170,340 l 20,-30 l 20,30 Z"/><path d="M 380,320 l 22,-32 l 22,32 Z"/>
          <path d="M 430,330 l 18,-28 l 18,28 Z"/>
        </g>
        <!-- 东大陆山脉 -->
        <g fill="#2a2115" opacity=".4">
          <path d="M 1380,300 l 24,-36 l 24,36 Z"/><path d="M 1420,310 l 20,-30 l 20,30 Z"/>
          <path d="M 1460,300 l 22,-32 l 22,32 Z"/><path d="M 1500,315 l 18,-28 l 18,28 Z"/>
        </g>
        <!-- 河流（蓝） -->
        <g fill="none" stroke="#4c7f9a" stroke-width="5" stroke-linecap="round" opacity=".65">
          <path d="M 360,380 C 420,420 480,470 540,520 C 590,560 620,600 650,650"/>
          <path d="M 1420,360 C 1450,420 1470,470 1500,520"/>
          <path d="M 1560,400 C 1600,450 1630,500 1650,560"/>
        </g>
        <!-- 森林（绿点） -->
        <g fill="#3d5a34" opacity=".55">
          <circle cx="1400" cy="330" r="7"/><circle cx="1430" cy="350" r="6"/><circle cx="1460" cy="335" r="7"/>
          <circle cx="1490" cy="360" r="6"/><circle cx="1520" cy="345" r="7"/><circle cx="1550" cy="370" r="6"/>
          <circle cx="1370" cy="360" r="6"/><circle cx="1410" cy="390" r="7"/><circle cx="1450" cy="410" r="6"/>
        </g>
        <!-- 冰川（白色） -->
        <g fill="rgba(235,245,250,.55)">
          <ellipse cx="260" cy="120" rx="120" ry="50"/>
          <ellipse cx="420" cy="90" rx="90" ry="38"/>
        </g>
      </g>

      <!-- ============ 2. 势力 ============ -->
      <g class="layer" data-layer="1">
        <!-- 帝国（西大陆） -->
        <path d="M 120,180 C 260,90 420,120 520,200 C 600,270 620,360 560,440 C 500,520 380,560 260,520 C 160,486 100,380 120,180 Z"
              fill="rgba(176,138,90,.4)" stroke="rgba(176,138,90,.9)" stroke-width="3" stroke-dasharray="10 6"/>
        <!-- 共和国（东大陆） -->
        <path d="M 1340,160 C 1500,110 1680,150 1820,240 C 1930,320 1940,440 1880,540 C 1800,650 1660,690 1520,640 C 1400,596 1320,470 1340,160 Z"
              fill="rgba(214,178,95,.4)" stroke="rgba(214,178,95,.9)" stroke-width="3" stroke-dasharray="10 6"/>
        <!-- 普卫岛（中央） -->
        <circle cx="920" cy="630" r="62" fill="rgba(95,211,196,.4)" stroke="rgba(95,211,196,.9)" stroke-width="3"/>
        <!-- 灰港（东南半岛） -->
        <path d="M 1480,650 C 1560,620 1660,630 1720,690 C 1760,740 1740,800 1680,820 C 1600,840 1520,790 1500,740 C 1486,706 1476,676 1480,650 Z"
              fill="rgba(127,174,143,.45)" stroke="rgba(127,174,143,.95)" stroke-width="3"/>
        <!-- 西昭（南方） -->
        <path d="M 240,680 C 340,650 440,670 480,730 C 510,780 470,830 390,840 C 300,850 220,800 210,750 C 205,720 220,696 240,680 Z"
              fill="rgba(192,80,77,.4)" stroke="rgba(192,80,77,.9)" stroke-width="3" stroke-dasharray="8 5"/>
        <!-- 洛斯汰（南方边缘） -->
        <path d="M 1060,780 C 1130,760 1210,775 1240,820 C 1262,856 1230,890 1170,892 C 1100,894 1040,860 1040,830 C 1040,812 1048,792 1060,780 Z"
              fill="rgba(201,168,106,.35)" stroke="rgba(201,168,106,.85)" stroke-width="3" stroke-dasharray="8 5"/>
        <!-- 无主之地 -->
        <ellipse cx="1090" cy="470" rx="150" ry="90" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="6 6"/>
      </g>

      <!-- ============ 3. 航路 ============ -->
      <g class="layer" data-layer="2">
        <!-- 商路 -->
        <g fill="none" stroke="rgba(240,217,160,.85)" stroke-width="3.5" stroke-dasharray="12 8">
          <path d="M 300,360 C 460,420 640,520 780,600"/>
          <path d="M 920,630 C 1060,540 1200,470 1340,430"/>
          <path d="M 1520,450 C 1600,500 1660,560 1700,640"/>
        </g>
        <!-- 暗航路 -->
        <path d="M 960,680 C 1120,720 1280,740 1420,720" fill="none" stroke="rgba(127,174,143,.9)" stroke-width="4" stroke-dasharray="4 10"/>
        <!-- 帝国压力线 -->
        <path d="M 300,360 C 520,300 760,290 1000,320 C 1180,342 1320,360 1420,380" fill="none" stroke="rgba(192,80,77,.8)" stroke-width="4" stroke-dasharray="16 6 4 6"/>
        <!-- 港口标记 -->
        <g fill="rgba(240,217,160,.9)">
          <circle cx="300" cy="360" r="7"/><circle cx="780" cy="600" r="7"/>
          <circle cx="920" cy="630" r="7"/><circle cx="1420" cy="720" r="7"/>
          <circle cx="1340" cy="430" r="7"/><circle cx="1520" cy="450" r="7"/>
        </g>
      </g>

      <!-- ============ 4. 城市 ============ -->
      <g class="layer" data-layer="3">
        <!-- 都城 -->
        <g>
          <circle cx="300" cy="360" r="15" fill="rgba(240,217,160,.25)" stroke="#f0d9a0" stroke-width="3"/>
          <circle cx="300" cy="360" r="5" fill="#f0d9a0"/>
          <circle cx="1520" cy="450" r="15" fill="rgba(240,217,160,.25)" stroke="#f0d9a0" stroke-width="3"/>
          <circle cx="1520" cy="450" r="5" fill="#f0d9a0"/>
        </g>
        <!-- 城市 -->
        <g fill="rgba(240,217,160,.85)" stroke="#f0d9a0" stroke-width="2">
          <circle cx="1320" cy="281" r="9"/><circle cx="1760" cy="338" r="9"/>
          <circle cx="1200" cy="450" r="9"/><circle cx="920" cy="630" r="9"/>
          <circle cx="1560" cy="664" r="9"/><circle cx="360" cy="697" r="9"/>
          <circle cx="1120" cy="810" r="9"/>
        </g>
        <!-- 城镇 -->
        <g fill="rgba(240,217,160,.55)">
          <circle cx="520" cy="405" r="5"/><circle cx="180" cy="112" r="5"/>
          <circle cx="560" cy="653" r="5"/><circle cx="720" cy="742" r="5"/>
          <circle cx="1000" cy="315" r="5"/><circle cx="1400" cy="731" r="5"/>
          <circle cx="1700" cy="742" r="5"/>
        </g>
      </g>

      <!-- ============ 5. 历史 ============ -->
      <g class="layer" data-layer="4">
        <!-- 千年战争范围 -->
        <ellipse cx="700" cy="960" rx="420" ry="110" fill="rgba(192,80,77,.18)" stroke="rgba(192,80,77,.7)" stroke-width="2.5" stroke-dasharray="10 8"/>
        <!-- 雪都旧址 -->
        <g>
          <circle cx="700" cy="990" r="14" fill="none" stroke="#a8b4bc" stroke-width="2.5" stroke-dasharray="4 3"/>
          <path d="M 690,990 l 20,0 M 700,980 l 0,20" stroke="#a8b4bc" stroke-width="2"/>
        </g>
        <!-- 西昭古堡旧址 -->
        <g>
          <rect x="1120" y="1010" width="30" height="22" fill="none" stroke="#a8b4bc" stroke-width="2.5" stroke-dasharray="4 3"/>
          <path d="M 1120,1010 l 8,-10 l 8,10 M 1144,1010 l 8,-10 l 8,10" fill="none" stroke="#a8b4bc" stroke-width="2"/>
        </g>
        <!-- 遗民聚落 -->
        <circle cx="400" cy="990" r="7" fill="none" stroke="#a8b4bc" stroke-width="2" stroke-dasharray="3 3"/>
        <!-- 箭头：人类北上 -->
        <g stroke="rgba(240,217,160,.6)" stroke-width="3" fill="none">
          <path d="M 700,900 L 700,760"/>
          <path d="M 690,780 l 10,-22 l 10,22"/>
        </g>
      </g>

      <!-- ============ 6. 生物群系 ============ -->
      <g class="layer" data-layer="5">
        <!-- 雪原 -->
        <path d="M 100,80 C 260,30 440,50 540,120 C 600,170 580,230 480,250 C 360,270 200,240 130,190 C 90,160 80,120 100,80 Z"
              fill="rgba(235,245,250,.38)"/>
        <!-- 草原 -->
        <path d="M 200,300 C 400,260 620,300 760,380 C 860,440 840,520 720,560 C 560,610 380,580 260,510 C 180,462 160,370 200,300 Z"
              fill="rgba(190,200,120,.28)"/>
        <!-- 森林 -->
        <path d="M 1320,220 C 1480,180 1660,220 1760,300 C 1830,360 1800,440 1680,470 C 1520,510 1380,470 1300,390 C 1250,340 1270,260 1320,220 Z"
              fill="rgba(80,130,70,.32)"/>
        <!-- 沙漠 -->
        <path d="M 1450,520 C 1600,490 1760,520 1840,590 C 1900,646 1860,706 1720,720 C 1580,734 1460,700 1420,640 C 1392,600 1408,546 1450,520 Z"
              fill="rgba(214,178,95,.3)"/>
        <!-- 海洋（浅） -->
        <g fill="rgba(76,127,154,.16)">
          <ellipse cx="880" cy="420" rx="300" ry="180"/>
          <ellipse cx="700" cy="820" rx="360" ry="120"/>
        </g>
      </g>

    </svg>
  </div>

  <div class="desc" id="desc"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
  const descs = [
    "<b>地形图</b>：西大陆的雪山带（黑脊脉）、东大陆的森林与河流、中央海域与南方群岛、底部南极冰川。山脉用三角标出，河流用蓝线。",
    "<b>势力图</b>：西 = 汉瑟尔帝国（褐），东 = 格洛克联邦共和国（金），中央 = 普卫岛（青），东南 = 灰港（绿），南方 = 西昭（红），南缘 = 洛斯汰（棕）。虚线为边界，中间那块空白是「无主之地」。",
    "<b>航路图</b>：金色虚线 = 商路（雾港—铁序、普卫—格洛克、格洛克—灰港）；绿色点线 = 暗航路（普卫岛—灰港）；红色 = 帝国压力线（自西向东压向共和国边境）。",
    "<b>城市图</b>：大圈 = 都城（铁序城、格洛克）；中圈 = 主要城市；小点 = 城镇。城市多沿河流与海岸线分布。",
    "<b>历史图</b>：底部红圈是千年前的战争范围；十字虚线为雪都旧址（已毁）；方框虚线为西昭古堡旧址（已毁）；箭头是人类北上的路线。",
    "<b>生物群系图</b>：白 = 雪原（西南与南极），黄绿 = 草原（西大陆中部），绿 = 森林（东大陆），黄 = 沙漠（东大陆南部），蓝 = 浅海。"
  ];
  const legends = [
    '<span><i class="sw" style="background:#2a2115"></i>山脉</span><span><i class="sw" style="background:#4c7f9a"></i>河流</span><span><i class="sw" style="background:#3d5a34"></i>森林</span><span><i class="sw" style="background:#ebf5fa"></i>冰川</span>',
    '<span><i class="sw" style="background:#b08a5a"></i>汉瑟尔帝国</span><span><i class="sw" style="background:#d6b25f"></i>共和国</span><span><i class="sw" style="background:#5fd3c4"></i>普卫岛</span><span><i class="sw" style="background:#7fae8f"></i>灰港</span><span><i class="sw" style="background:#c0504d"></i>西昭</span><span><i class="sw" style="background:#c9a86a"></i>洛斯汰</span>',
    '<span><i class="sw" style="background:#f0d9a0"></i>商路</span><span><i class="sw" style="background:#7fae8f"></i>暗航路</span><span><i class="sw" style="background:#c0504d"></i>帝国压力线</span>',
    '<span><i class="sw" style="background:#f0d9a0"></i>都城</span><span><i class="sw" style="background:#d9b96a"></i>城市</span><span><i class="sw" style="background:#8a7a5c"></i>城镇</span>',
    '<span><i class="sw" style="background:#c0504d"></i>千年战争范围</span><span><i class="sw" style="background:#a8b4bc"></i>遗址</span><span><i class="sw" style="background:#f0d9a0"></i>人类北上</span>',
    '<span><i class="sw" style="background:#ebf5fa"></i>雪原</span><span><i class="sw" style="background:#bec878"></i>草原</span><span><i class="sw" style="background:#508246"></i>森林</span><span><i class="sw" style="background:#d6b25f"></i>沙漠</span><span><i class="sw" style="background:#4c7f9a"></i>浅海</span>'
  ];
  const buttons = [...document.querySelectorAll('.tabs button')];
  const layers = [...document.querySelectorAll('.layer')];
  const desc = document.getElementById('desc');
  const legend = document.getElementById('legend');
  function select(i){
    buttons.forEach((b,idx)=>b.classList.toggle('on', idx===i));
    layers.forEach((l,idx)=>l.classList.toggle('on', idx===i));
    desc.innerHTML = descs[i];
    legend.innerHTML = legends[i];
  }
  buttons.forEach(b=>b.addEventListener('click', ()=>select(+b.dataset.i)));
  select(0);
</script>
</body>
</html>
